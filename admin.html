<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CheckerDiscount Admin V9</title>

    <style>
        body {
            font-family: Inter, Arial, sans-serif;
            background: #f6f8fc;
            color: #172033;
            margin: 0;
        }

        .wrap {
            max-width: 1200px;
            margin: auto;
            padding: 30px 18px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e4eaf2;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 28px #10182812;
        }

        h1 {
            margin-top: 0;
        }

        h2 {
            margin-top: 0;
        }

        input,
        button,
        select {
            padding: 11px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font: inherit;
        }

        input {
            width: 100%;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #155eef;
            color: #ffffff;
            border: 0;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #eeeeee;
            text-align: left;
        }

        th {
            background: #f8fafc;
        }

        small {
            color: #667085;
        }

        #msg {
            margin-bottom: 0;
            font-weight: 600;
        }

        @media (max-width: 700px) {

            .grid {
                grid-template-columns: 1fr;
            }

            table {
                display: block;
                overflow: auto;
                white-space: nowrap;
            }

            .wrap {
                padding: 20px 12px;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="wrap">

        <h1>CheckerDiscount Admin</h1>

        <!-- Admin Login -->
        <div class="card">

            <label for="key">
                <strong>Admin Key</strong>
            </label>

            <input
                id="key"
                type="password"
                placeholder="Enter ADMIN_KEY"
            >

            <button
                id="load"
                style="margin-top: 10px;"
            >
                Login / Load
            </button>

            <p id="msg"></p>

        </div>


        <!-- Add Deal -->
        <div class="card">

            <h2>Add Deal</h2>

            <form id="dealForm">

                <div class="grid">

                    <input
                        id="title"
                        placeholder="Title"
                        required
                    >

                    <input
                        id="store"
                        placeholder="Store"
                        required
                    >

                    <input
                        id="old"
                        type="number"
                        step="0.01"
                        placeholder="Old price"
                        required
                    >

                    <input
                        id="new"
                        type="number"
                        step="0.01"
                        placeholder="New price"
                        required
                    >

                    <input
                        id="url"
                        placeholder="Product URL"
                        required
                    >

                    <input
                        id="image"
                        placeholder="Image URL"
                    >

                    <input
                        id="asin"
                        placeholder="ASIN"
                    >

                    <input
                        id="currency"
                        value="USD"
                        placeholder="Currency"
                    >

                </div>

                <button
                    type="submit"
                    style="margin-top: 12px;"
                >
                    Add Deal
                </button>

            </form>

        </div>


        <!-- Add Coupon -->
        <div class="card">

            <h2>Add Coupon</h2>

            <form id="couponForm">

                <div class="grid">

                    <input
                        id="cstore"
                        placeholder="Store"
                        required
                    >

                    <input
                        id="ctitle"
                        placeholder="Coupon title"
                        required
                    >

                    <input
                        id="ccode"
                        placeholder="Code"
                    >

                    <input
                        id="cdiscount"
                        placeholder="e.g. 15% OFF"
                    >

                    <input
                        id="curl"
                        placeholder="Coupon URL"
                    >

                    <input
                        id="cexpire"
                        placeholder="Expiry date/time"
                    >

                </div>

                <button
                    type="submit"
                    style="margin-top: 12px;"
                >
                    Add Coupon
                </button>

            </form>

        </div>


        <!-- Deals -->
        <div class="card">

            <h2>Deals</h2>

            <div id="deals">
                Login to load.
            </div>

        </div>

    </div>


    <script>

        const API = "https://deal-api.hamraahirn32.workers.dev";

        let KEY = "";


        // Shortcut for getElementById
        const $ = (id) => document.getElementById(id);


        // API helper
        async function api(path, options = {}) {

            options.headers = {
                ...(options.headers || {}),
                "X-Admin-Key": KEY,
                "Content-Type": "application/json"
            };

            const response = await fetch(
                API + path,
                options
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Request failed"
                );
            }

            return data;
        }


        // Message
        function msg(text) {
            $("msg").textContent = text;
        }


        // Login / Load
        async function load() {

            KEY = $("key").value.trim();

            if (!KEY) {
                msg("Enter Admin Key.");
                return;
            }

            try {

                await refresh();

                msg("Connected.");

            } catch (error) {

                msg(error.message);

            }
        }


        // Refresh deals
        async function refresh() {

            const data = await api(
                "/api/admin/deals"
            );

            if (!data.deals || data.deals.length === 0) {

                $("deals").innerHTML = `
                    <p>No deals found.</p>
                `;

                return;
            }


            const rows = data.deals.map((deal) => {

                let featuredButton = "";


                // Featured button
                if (Number(deal.is_featured) === 1) {

                    featuredButton = `
                        <button
                            onclick="act('/api/admin/deals/${deal.id}/unfeatured')"
                        >
                            Unfeature
                        </button>
                    `;

                } else if (
                    deal.verification_status === "VERIFIED"
                ) {

                    featuredButton = `
                        <button
                            onclick="act('/api/admin/deals/${deal.id}/featured')"
                        >
                            Set Featured
                        </button>
                    `;

                }


                // Verify button
                const verifyButton =
                    deal.verification_status !== "VERIFIED"
                        ? `
                            <button
                                onclick="act('/api/admin/deals/${deal.id}/verify')"
                            >
                                Verify
                            </button>
                        `
                        : "";


                return `
                    <tr>

                        <td>
                            ${deal.id}
                        </td>

                        <td>
                            ${esc(deal.title)}

                            ${
                                Number(deal.is_featured) === 1
                                    ? " ⭐"
                                    : ""
                            }
                        </td>

                        <td>
                            ${esc(deal.store)}
                        </td>

                        <td>
                            ${deal.currency || "USD"}
                            ${Number(deal.new_price).toFixed(2)}
                        </td>

                        <td>
                            ${esc(deal.verification_status)}
                        </td>

                        <td>

                            <div class="actions">

                                ${verifyButton}

                                ${featuredButton}

                                <button
                                    onclick="act('/api/admin/deals/${deal.id}/expire')"
                                >
                                    Expire
                                </button>

                                <button
                                    onclick="delDeal(${deal.id})"
                                >
                                    Delete
                                </button>

                            </div>

                        </td>

                    </tr>
                `;

            }).join("");


            $("deals").innerHTML = `

                <table>

                    <tr>

                        <th>ID</th>
                        <th>Deal</th>
                        <th>Store</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                    ${rows}

                </table>

            `;
        }


        // Action
        async function act(path) {

            try {

                await api(
                    path,
                    {
                        method: "POST"
                    }
                );

                await refresh();

            } catch (error) {

                alert(error.message);

            }
        }


        // Delete deal
        async function delDeal(id) {

            if (!confirm("Delete this deal?")) {
                return;
            }

            try {

                await api(
                    "/api/admin/deals/" + id,
                    {
                        method: "DELETE"
                    }
                );

                await refresh();

            } catch (error) {

                alert(error.message);

            }
        }


        // Escape HTML
        function esc(value) {

            return String(value ?? "")
                .replace(
                    /[&<>"']/g,
                    (char) => {

                        return {
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                            "'": "&#39;"
                        }[char];

                    }
                );
        }


        // Login button
        $("load").onclick = load;


        // Add Deal
        $("dealForm").onsubmit = async (event) => {

            event.preventDefault();

            try {

                await api(
                    "/api/admin/deals",
                    {
                        method: "POST",

                        body: JSON.stringify({

                            title: $("title").value,

                            store: $("store").value,

                            old_price: $("old").value,

                            new_price: $("new").value,

                            url: $("url").value,

                            image_url: $("image").value,

                            asin: $("asin").value,

                            currency: $("currency").value

                        })
                    }
                );


                event.target.reset();

                $("currency").value = "USD";

                await refresh();

                msg("Deal added.");

            } catch (error) {

                alert(error.message);

            }
        };


        // Add Coupon
        $("couponForm").onsubmit = async (event) => {

            event.preventDefault();

            try {

                await api(
                    "/api/admin/coupons",
                    {
                        method: "POST",

                        body: JSON.stringify({

                            store: $("cstore").value,

                            title: $("ctitle").value,

                            code: $("ccode").value,

                            discount_text: $("cdiscount").value,

                            url: $("curl").value,

                            expires_at: $("cexpire").value

                        })
                    }
                );


                event.target.reset();

                msg("Coupon added.");

            } catch (error) {

                alert(error.message);

            }
        };

    </script>

</body>

</html>
