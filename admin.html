<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckerDiscount Admin Panel</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 30px 20px;
}

.header {
  background: white;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.header h1 {
  margin: 0 0 6px;
  font-size: 28px;
}

.header p {
  margin: 0;
  color: #687386;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.card h2 {
  margin-top: 0;
}

input,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d8deea;
  border-radius: 9px;
  font-size: 15px;
  margin-top: 6px;
}

label {
  display: block;
  margin-bottom: 15px;
  font-weight: 600;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 16px;
  cursor: pointer;
  font-weight: 600;
}

.primary {
  background: #1769e0;
  color: white;
}

.success {
  background: #16a34a;
  color: white;
}

.warning {
  background: #f59e0b;
  color: white;
}

.danger {
  background: #dc2626;
  color: white;
}

.secondary {
  background: #e8edf5;
  color: #172033;
}

button:hover {
  opacity: .9;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.full {
  grid-column: 1 / -1;
}

.message {
  padding: 12px;
  border-radius: 9px;
  margin-top: 15px;
  display: none;
}

.message.success-msg {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.message.error-msg {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #e5e9f1;
  text-align: left;
  vertical-align: middle;
}

th {
  background: #f8fafc;
}

.status {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
}

.pending {
  background: #fef3c7;
  color: #92400e;
}

.verified {
  background: #dcfce7;
  color: #166534;
}

.expired {
  background: #fee2e2;
  color: #991b1b;
}

.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.hidden {
  display: none;
}

.small {
  font-size: 13px;
  color: #687386;
}

@media (max-width: 700px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .container {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>CheckerDiscount Admin Panel</h1>
    <p>Manage, verify and expire your deals.</p>
  </div>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <h2>Admin Login</h2>

    <label>
      Admin Key
      <input
        type="password"
        id="adminKey"
        placeholder="Enter your ADMIN_KEY"
      >
    </label>

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

    <p class="small">
      Your ADMIN_KEY is not stored in this page.
    </p>
  </div>


  <!-- ADMIN AREA -->
  <div id="adminArea" class="hidden">

    <!-- ADD DEAL -->
    <div class="card">

      <h2>Add New Deal</h2>

      <div class="grid">

        <label>
          Product Title
          <input
            type="text"
            id="title"
            placeholder="Example: Apple AirPods Pro"
          >
        </label>

        <label>
          Store
          <input
            type="text"
            id="store"
            placeholder="Example: Amazon"
          >
        </label>

        <label>
          Old Price
          <input
            type="number"
            id="old_price"
            step="0.01"
            placeholder="199.99"
          >
        </label>

        <label>
          New Price
          <input
            type="number"
            id="new_price"
            step="0.01"
            placeholder="149.99"
          >
        </label>

        <label>
          Currency
          <select id="currency">
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
            <option value="EUR">EUR</option>
            <option value="CAD">CAD</option>
          </select>
        </label>

        <label>
          ASIN
          <input
            type="text"
            id="asin"
            placeholder="Required for Amazon deals"
          >
        </label>

        <label class="full">
          Product URL
          <input
            type="url"
            id="url"
            placeholder="https://..."
          >
        </label>

        <label class="full">
          Image URL
          <input
            type="url"
            id="image_url"
            placeholder="https://..."
          >
        </label>

      </div>

      <button class="primary" onclick="addDeal()">
        Add Deal
      </button>

      <div id="addMessage" class="message"></div>

    </div>


    <!-- DEALS -->
    <div class="card">

      <h2>All Deals</h2>

      <button class="secondary" onclick="loadDeals()">
        Refresh Deals
      </button>

      <div id="dealsMessage" class="message"></div>

      <br>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Store</th>
              <th>Prices</th>
              <th>Discount</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="dealsTable">
          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script>

/*
====================================================
CHECKERDISCOUNT API
====================================================
*/

const API_BASE = "https://deal-api.hamraahirn32.workers.dev";

let ADMIN_KEY = "";


/*
====================================================
HELPERS
====================================================
*/

function showMessage(elementId, message, type) {

  const element = document.getElementById(elementId);

  element.textContent = message;

  element.className = "message " +
    (type === "success" ? "success-msg" : "error-msg");
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
====================================================
LOGIN
====================================================
*/

async function login() {

  const keyInput = document.getElementById("adminKey");

  ADMIN_KEY = keyInput.value.trim();

  if (!ADMIN_KEY) {

    showMessage(
      "loginMessage",
      "Please enter your ADMIN_KEY.",
      "error"
    );

    return;
  }

  try {

    const response = await fetch(
      API_BASE + "/api/admin/deals",
      {
        method: "GET",
        headers: {
          "X-Admin-Key": ADMIN_KEY
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      showMessage(
        "loginMessage",
        data.error || "Login failed.",
        "error"
      );

      return;
    }

    document.getElementById("loginCard").classList.add("hidden");

    document.getElementById("adminArea").classList.remove("hidden");

    loadDeals();

  } catch (error) {

    showMessage(
      "loginMessage",
      "Could not contact the API. Please check the API URL.",
      "error"
    );

    console.error(error);
  }
}


/*
====================================================
LOAD DEALS
====================================================
*/

async function loadDeals() {

  const table = document.getElementById("dealsTable");

  table.innerHTML = `
    <tr>
      <td colspan="7">
        Loading deals...
      </td>
    </tr>
  `;

  try {

    const response = await fetch(
      API_BASE + "/api/admin/deals",
      {
        method: "GET",
        headers: {
          "X-Admin-Key": ADMIN_KEY
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      showMessage(
        "dealsMessage",
        data.error || "Could not load deals.",
        "error"
      );

      return;
    }

    renderDeals(data.deals || []);

  } catch (error) {

    showMessage(
      "dealsMessage",
      "Could not contact the API.",
      "error"
    );

    console.error(error);
  }
}


/*
====================================================
RENDER DEALS
====================================================
*/

function renderDeals(deals) {

  const table = document.getElementById("dealsTable");

  if (!deals.length) {

    table.innerHTML = `
      <tr>
        <td colspan="7">
          No deals found.
        </td>
      </tr>
    `;

    return;
  }

  table.innerHTML = deals.map(deal => {

    const status = String(
      deal.verification_status || "PENDING"
    ).toUpperCase();

    let statusClass = "pending";

    if (status === "VERIFIED") {
      statusClass = "verified";
    }

    if (status === "EXPIRED") {
      statusClass = "expired";
    }

    return `
      <tr>

        <td>
          ${escapeHtml(deal.id)}
        </td>

        <td>
          <strong>
            ${escapeHtml(deal.title)}
          </strong>
        </td>

        <td>
          ${escapeHtml(deal.store)}
        </td>

        <td>
          ${escapeHtml(deal.currency || "USD")}
          ${Number(deal.new_price).toFixed(2)}
          <br>

          <span class="small">
            Was ${escapeHtml(deal.currency || "USD")}
            ${Number(deal.old_price).toFixed(2)}
          </span>
        </td>

        <td>
          <strong>
            ${Number(deal.discount_percent || 0).toFixed(2)}%
          </strong>
        </td>

        <td>
          <span class="status ${statusClass}">
            ${escapeHtml(status)}
          </span>
        </td>

        <td>

          <div class="actions">

            ${
              status !== "VERIFIED"
              ? `
                <button
                  class="success"
                  onclick="verifyDeal(${deal.id})">
                  Verify
                </button>
              `
              : ""
            }

            ${
              status === "VERIFIED"
              ? `
                <button
                  class="warning"
                  onclick="expireDeal(${deal.id})">
                  Expire
                </button>
              `
              : ""
            }

            <button
              class="danger"
              onclick="deleteDeal(${deal.id})">
              Delete
            </button>

          </div>

        </td>

      </tr>
    `;

  }).join("");
}


/*
====================================================
ADD DEAL
====================================================
*/

async function addDeal() {

  const payload = {

    title:
      document.getElementById("title").value.trim(),

    store:
      document.getElementById("store").value.trim(),

    old_price:
      Number(document.getElementById("old_price").value),

    new_price:
      Number(document.getElementById("new_price").value),

    currency:
      document.getElementById("currency").value,

    url:
      document.getElementById("url").value.trim(),

    image_url:
      document.getElementById("image_url").value.trim(),

    asin:
      document.getElementById("asin").value.trim()
  };


  try {

    const response = await fetch(
      API_BASE + "/api/admin/deals",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "X-Admin-Key": ADMIN_KEY
        },

        body: JSON.stringify(payload)
      }
    );


    const data = await response.json();


    if (!response.ok) {

      showMessage(
        "addMessage",
        data.error || "Could not add deal.",
        "error"
      );

      return;
    }


    showMessage(
      "addMessage",
      "Deal added successfully as PENDING.",
      "success"
    );


    document.getElementById("title").value = "";
    document.getElementById("store").value = "";
    document.getElementById("old_price").value = "";
    document.getElementById("new_price").value = "";
    document.getElementById("url").value = "";
    document.getElementById("image_url").value = "";
    document.getElementById("asin").value = "";


    loadDeals();


  } catch (error) {

    showMessage(
      "addMessage",
      "Could not contact the API.",
      "error"
    );

    console.error(error);
  }
}


/*
====================================================
VERIFY DEAL
====================================================
*/

async function verifyDeal(id) {

  const confirmed = confirm(
    "Are you sure this deal has been checked and the price is correct?"
  );

  if (!confirmed) {
    return;
  }


  try {

    const response = await fetch(
      API_BASE + "/api/admin/deals/" + id + "/verify",
      {
        method: "POST",

        headers: {
          "X-Admin-Key": ADMIN_KEY
        }
      }
    );


    const data = await response.json();


    if (!response.ok) {

      alert(
        data.error || "Could not verify deal."
      );

      return;
    }


    alert("Deal verified successfully.");

    loadDeals();


  } catch (error) {

    alert("Could not contact the API.");

    console.error(error);
  }
}


/*
====================================================
EXPIRE DEAL
====================================================
*/

async function expireDeal(id) {

  const confirmed = confirm(
    "Are you sure you want to expire this deal?"
  );

  if (!confirmed) {
    return;
  }


  try {

    const response = await fetch(
      API_BASE + "/api/admin/deals/" + id + "/expire",
      {
        method: "POST",

        headers: {
          "X-Admin-Key": ADMIN_KEY
        }
      }
    );


    const data = await response.json();


    if (!response.ok) {

      alert(
        data.error || "Could not expire deal."
      );

      return;
    }


    alert("Deal expired successfully.");

    loadDeals();


  } catch (error) {

    alert("Could not contact the API.");

    console.error(error);
  }
}


/*
====================================================
DELETE DEAL
====================================================
*/

async function deleteDeal(id) {

  const confirmed = confirm(
    "Are you sure you want to permanently delete this deal?"
  );

  if (!confirmed) {
    return;
  }


  try {

    const response = await fetch(
      API_BASE + "/api/admin/deals/" + id,
      {
        method: "DELETE",

        headers: {
          "X-Admin-Key": ADMIN_KEY
        }
      }
    );


    const data = await response.json();


    if (!response.ok) {

      alert(
        data.error || "Could not delete deal."
      );

      return;
    }


    alert("Deal deleted successfully.");

    loadDeals();


  } catch (error) {

    alert("Could not contact the API.");

    console.error(error);
  }
}

</script>

</body>
</html>
