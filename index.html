<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checker Discount - Calculator & Savings Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            width: 90%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #4364f7;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #4364f7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0052d4;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #eef2ff;
            border-radius: 8px;
            border-left: 5px solid #4364f7;
            display: none;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .result-item.final {
            font-weight: bold;
            color: #2b8a3e;
            font-size: 1.3rem;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            margin-bottom: 0;
        }
        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            background: #222;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Checker Discount</h1>
        <p>Calculate your savings and final product prices instantly</p>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="originalPrice">Original Price</label>
            <input type="number" id="originalPrice" placeholder="e.g. 100">
        </div>

        <div class="form-group">
            <label for="discountPercent">Discount Percentage (%)</label>
            <input type="number" id="discountPercent" placeholder="e.g. 20">
        </div>

        <button onclick="calculateDiscount()">Calculate Discount</button>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <span>You Save:</span>
                <span id="savingsAmount">$0.00</span>
            </div>
            <div class="result-item final">
                <span>Final Price:</span>
                <span id="finalPrice">$0.00</span>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Checker Discount. All rights reserved.</p>
    </footer>

    <script>
        function calculateDiscount() {
            const price = parseFloat(document.getElementById('originalPrice').value);
            const discount = parseFloat(document.getElementById('discountPercent').value);
            
            if (isNaN(price) || isNaN(discount) || price <= 0 || discount < 0) {
                alert('Please enter valid numbers for price and discount.');
                return;
            }

            const savings = (price * discount) / 100;
            const final = price - savings;

            document.getElementById('savingsAmount').innerText = '$' + savings.toFixed(2);
            document.getElementById('finalPrice').innerText = '$' + final.toFixed(2);
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>

</body>
</html>
