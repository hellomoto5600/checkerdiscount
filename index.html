<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CheckerDiscount - Verified Deals & Price Savings</title>

    <meta
        name="description"
        content="Discover verified online deals, compare prices and find genuine savings from trusted retailers."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           CHECKERDISCOUNT
           FINAL PROFESSIONAL LIGHT DESIGN
           API / DATABASE STRUCTURE PRESERVED
        ========================================================= */

        :root {

            --bg-deep: #f6f8fc;
            --bg-card: #ffffff;
            --bg-soft: #f8fafc;

            --border-color: #e5e7eb;
            --border-light: #eef1f5;

            --blue: #2563eb;
            --blue-dark: #1d4ed8;
            --blue-soft: #eff6ff;

            --green: #16a34a;
            --green-dark: #15803d;
            --green-soft: #f0fdf4;

            --orange: #f97316;
            --orange-dark: #ea580c;
            --orange-soft: #fff7ed;

            --red: #dc2626;
            --red-soft: #fef2f2;

            --navy: #0f172a;
            --text-main: #111827;
            --text-muted: #64748b;
            --text-light: #94a3b8;

            --shadow:
                0 8px 30px rgba(15, 23, 42, 0.055);

            --shadow-hover:
                0 18px 45px rgba(15, 23, 42, 0.12);
        }


        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            margin: 0;
            padding: 0;

            background:
                radial-gradient(
                    circle at 50% -15%,
                    rgba(37, 99, 235, 0.06),
                    transparent 38%
                ),
                var(--bg-deep);

            color: var(--text-main);

            font-family:
                "Inter",
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            line-height: 1.5;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        header {

            position: sticky;
            top: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 15px 28px;

            background:
                rgba(255, 255, 255, 0.95);

            border-bottom:
                1px solid rgba(229, 231, 235, 0.9);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 1px 10px rgba(15, 23, 42, 0.035);
        }


        .logo-container {

            display: flex;
            align-items: center;

            gap: 11px;
        }


        .logo-icon {

            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #3b82f6
                );

            color: white;

            font-size: 16px;
            font-weight: 800;

            letter-spacing: -0.5px;

            box-shadow:
                0 7px 18px rgba(37, 99, 235, 0.22);
        }


        .logo-text {

            color: var(--text-main);

            font-size: 20px;
            font-weight: 800;

            letter-spacing: -0.7px;
        }


        /* =========================================================
           TRUST BADGE
        ========================================================= */

        .trust-badge {

            display: flex;
            align-items: center;

            gap: 6px;

            padding: 7px 13px;

            border-radius: 999px;

            background:
                var(--green-soft);

            border:
                1px solid #bbf7d0;

            color:
                var(--green-dark);

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main-container {

            max-width: 1180px;

            margin: 0 auto;

            padding:
                68px 24px 80px;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero-section {

            text-align: center;

            margin-bottom: 50px;
        }


        .hero-section h1 {

            position: relative;

            width: 100%;

            min-height: 108px;

            margin:
                0 auto 17px;

            color: transparent;

            font-size:
                clamp(34px, 5vw, 50px);

            line-height: 1.08;

            font-weight: 800;

            letter-spacing: -2px;
        }


        .hero-section h1::before {

            content:
                "Find Deals Worth Clicking";

            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            color:
                var(--text-main);

            animation:
                heroTextChange 12s infinite;
        }


        .hero-section h1::after {

            content: "";

            position: absolute;

            left: 50%;

            transform:
                translateX(-50%);

            bottom: 0;

            width: 52px;
            height: 4px;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    var(--blue),
                    #22c55e
                );
        }


        @keyframes heroTextChange {

            0%, 20% {
                content: "Find Deals Worth Clicking";
                opacity: 1;
            }

            23% {
                content: "Discover Real Savings";
                opacity: 0;
                transform: translateY(7px);
            }

            25%, 45% {
                content: "Discover Real Savings";
                opacity: 1;
                transform: translateY(0);
            }

            48% {
                content: "Compare Before You Buy";
                opacity: 0;
                transform: translateY(7px);
            }

            50%, 70% {
                content: "Compare Before You Buy";
                opacity: 1;
                transform: translateY(0);
            }

            73% {
                content: "Don't Overpay for Products";
                opacity: 0;
                transform: translateY(7px);
            }

            75%, 95% {
                content: "Don't Overpay for Products";
                opacity: 1;
                transform: translateY(0);
            }

            98% {
                content: "Find Deals Worth Clicking";
                opacity: 0;
                transform: translateY(7px);
            }

            100% {
                content: "Find Deals Worth Clicking";
                opacity: 1;
                transform: translateY(0);
            }
        }


        .hero-section p {

            max-width: 650px;

            margin:
                21px auto 0;

            color:
                var(--text-muted);

            font-size: 15px;

            line-height: 1.75;
        }


        /* =========================================================
           GRID
        ========================================================= */

        .grid-layout {

            display: grid;

            grid-template-columns:
                minmax(0, 2fr)
                minmax(310px, 1fr);

            gap: 28px;

            align-items: start;
        }


        /* =========================================================
           MAIN CARDS
        ========================================================= */

        .card {

            position: relative;

            overflow: hidden;

            padding: 27px;

            background:
                rgba(255, 255, 255, 0.98);

            border:
                1px solid var(--border-color);

            border-radius: 18px;

            box-shadow:
                var(--shadow);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    rgba(37, 99, 235, 0.85),
                    rgba(34, 197, 94, 0.65)
                );
        }


        .card:hover {

            transform:
                translateY(-2px);

            box-shadow:
                var(--shadow-hover);

            border-color:
                #dce3ec;
        }


        .card h3 {

            margin-top: 0;
            margin-bottom: 21px;

            padding-bottom: 15px;

            border-bottom:
                1px solid var(--border-light);

            color:
                var(--text-main);

            font-size: 17px;

            font-weight: 750;

            letter-spacing:
                -0.3px;
        }


        /* =========================================================
           DEAL AREA
        ========================================================= */

        #discountsContainer {

            min-height: 180px;
        }


        #discountsContainer > p {

            margin: 0;

            padding: 30px 20px;

            background:
                linear-gradient(
                    180deg,
                    #fbfdff,
                    #f8fafc
                );

            border:
                1px dashed #d8e0ea;

            border-radius: 12px;

            color:
                var(--text-muted) !important;

            font-size: 13px;

            text-align: center;
        }


        /* =========================================================
           PROFESSIONAL DEAL CARD
        ========================================================= */

        .discount-card {

            position: relative;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            margin-bottom: 18px;

            padding: 0;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fbfdff
                );

            border:
                1px solid #e2e8f0;

            border-radius: 17px;

            box-shadow:
                0 8px 25px rgba(15, 23, 42, 0.055);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }


        .discount-card:last-child {
            margin-bottom: 0;
        }


        .discount-card:hover {

            transform:
                translateY(-4px);

            border-color:
                #cbd5e1;

            box-shadow:
                0 18px 42px rgba(15, 23, 42, 0.12);
        }


        .discount-card::before {

            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            background:
                linear-gradient(
                    180deg,
                    #2563eb,
                    #22c55e
                );
        }


        .deal-card-content {

            display: flex;

            align-items: stretch;

            min-height: 205px;
        }


        /* =========================================================
           DEAL IMAGE
        ========================================================= */

        .deal-image {

            width: 220px;

            min-width: 220px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    #f8fafc,
                    #ffffff
                );

            border-right:
                1px solid #edf1f5;
        }


        .deal-image img {

            display: block;

            width: 100%;
            height: 155px;

            object-fit: contain;

            mix-blend-mode: multiply;

            transition:
                transform 0.3s ease;
        }


        .discount-card:hover .deal-image img {

            transform:
                scale(1.04);
        }


        /* =========================================================
           DEAL INFO
        ========================================================= */

        .deal-info {

            position: relative;

            flex: 1;

            padding: 21px 22px 20px;
        }


        .deal-store {

            display: inline-flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 9px;

            padding: 5px 9px;

            border-radius: 6px;

            background:
                #f8fafc;

            border:
                1px solid #e2e8f0;

            color:
                #475569;

            font-size: 11px;

            font-weight: 800;

            letter-spacing:
                0.25px;

            text-transform:
                uppercase;
        }


        .deal-store::before {

            content:
                "✓";

            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            background:
                var(--green-soft);

            color:
                var(--green-dark);

            font-size: 10px;
        }


        .deal-title {

            margin:
                0 92px 13px 0;

            color:
                var(--navy);

            font-size: 17px;

            line-height: 1.4;

            font-weight: 750;

            letter-spacing:
                -0.35px;
        }


        /* =========================================================
           DISCOUNT BADGE
        ========================================================= */

        .deal-discount {

            position: absolute;

            top: 18px;
            right: 18px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 76px;

            padding:
                7px 10px;

            border-radius:
                999px;

            background:
                linear-gradient(
                    135deg,
                    #fff1f2,
                    #ffe4e6
                );

            border:
                1px solid #fecdd3;

            color:
                #be123c;

            font-size:
                12px;

            font-weight:
                800;

            letter-spacing:
                0.2px;

            box-shadow:
                0 4px 12px rgba(225, 29, 72, 0.08);
        }


        /* =========================================================
           PRICING
        ========================================================= */

        .deal-pricing {

            display: flex;

            align-items: flex-end;

            flex-wrap: wrap;

            gap: 9px;

            margin-bottom: 14px;
        }


        .deal-old-price {

            color:
                #94a3b8;

            font-size:
                13px;

            text-decoration:
                line-through;

            text-decoration-thickness:
                1.5px;
        }


        .deal-new-price {

            color:
                #0f172a;

            font-size:
                27px;

            line-height:
                1;

            font-weight:
                800;

            letter-spacing:
                -1px;
        }


        .deal-saving {

            display: inline-flex;

            align-items: center;

            padding:
                4px 8px;

            border-radius:
                6px;

            background:
                var(--green-soft);

            color:
                var(--green-dark);

            font-size:
                11px;

            font-weight:
                800;
        }


        /* =========================================================
           DEAL MESSAGE
        ========================================================= */

        .deal-message {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 16px;

            color:
                #475569;

            font-size:
                12px;

            font-weight:
                600;
        }


        .deal-message::before {

            content:
                "💡";
        }


        /* =========================================================
           DEAL BUTTON
        ========================================================= */

        .deal-button {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            min-width: 160px;

            padding:
                11px 17px;

            border-radius:
                9px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color:
                #ffffff;

            text-decoration:
                none;

            font-size:
                13px;

            font-weight:
                800;

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .deal-button::after {

            content:
                "→";

            font-size:
                17px;

            line-height:
                1;

            transition:
                transform 0.2s ease;
        }


        .deal-button:hover {

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #1e40af
                );

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 24px rgba(37, 99, 235, 0.30);
        }


        .deal-button:hover::after {

            transform:
                translateX(3px);
        }


        .deal-button:active {

            transform:
                translateY(0);
        }


        /* =========================================================
           FORM
        ========================================================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color:
                #475569;

            font-size: 12px;

            font-weight: 700;
        }


        .form-control {

            width: 100%;

            padding:
                12px 14px;

            background:
                #ffffff;

            border:
                1px solid #d6dce5;

            border-radius:
                10px;

            color:
                #111827;

            font-family:
                inherit;

            font-size:
                14px;

            outline:
                none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-control::placeholder {

            color:
                #a0a9b7;
        }


        .form-control:hover {

            border-color:
                #b8c2d0;
        }


        .form-control:focus {

            border-color:
                var(--blue);

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.09);
        }


        /* =========================================================
           BUTTON
        ========================================================= */

        .btn-primary {

            width: 100%;

            margin-top: 7px;

            padding:
                13px 16px;

            border:
                none;

            border-radius:
                10px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--blue-dark)
                );

            color:
                #ffffff;

            font-family:
                inherit;

            font-size:
                14px;

            font-weight:
                700;

            cursor:
                pointer;

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .btn-primary:hover {

            opacity:
                0.97;

            transform:
                translateY(-1px);

            box-shadow:
                0 11px 25px
                rgba(37, 99, 235, 0.28);
        }


        .btn-primary:active {

            transform:
                translateY(0);
        }


        /* =========================================================
           MOBILE DEAL CARD
        ========================================================= */

        @media (max-width: 900px) {

            .grid-layout {

                grid-template-columns:
                    1fr;
            }
        }


        @media (max-width: 680px) {

            .deal-card-content {

                display:
                    block;
            }


            .deal-image {

                width: 100%;
                min-width: 0;

                height: 180px;

                padding: 20px;

                border-right:
                    none;

                border-bottom:
                    1px solid #edf1f5;
            }


            .deal-image img {

                height:
                    140px;
            }


            .deal-info {

                padding:
                    18px;
            }


            .deal-title {

                margin-right:
                    80px;

                font-size:
                    16px;
            }


            .deal-new-price {

                font-size:
                    25px;
            }


            .deal-button {

                width:
                    100%;
            }
        }


        @media (max-width: 768px) {

            header {

                padding:
                    13px 17px;
            }


            .logo-icon {

                width: 38px;
                height: 38px;

                border-radius:
                    10px;

                font-size:
                    14px;
            }


            .logo-text {

                font-size:
                    18px;
            }


            .trust-badge {

                padding:
                    6px 9px;

                font-size:
                    10px;
            }


            .main-container {

                padding:
                    45px 16px 55px;
            }


            .hero-section {

                margin-bottom:
                    35px;
            }


            .hero-section h1 {

                min-height:
                    104px;

                font-size:
                    32px;

                letter-spacing:
                    -1.2px;
            }


            .hero-section p {

                font-size:
                    14px;
            }


            .grid-layout {

                gap:
                    20px;
            }


            .card {

                padding:
                    22px;

                border-radius:
                    14px;
            }
        }


        @media (max-width: 520px) {

            header {

                gap:
                    10px;
            }


            .logo-container {

                gap:
                    8px;
            }


            .logo-text {

                font-size:
                    16px;
            }


            .trust-badge {

                max-width:
                    145px;

                white-space:
                    normal;

                text-align:
                    center;

                line-height:
                    1.2;
            }


            .trust-badge span {

                display:
                    none;
            }


            .main-container {

                padding-top:
                    38px;
            }


            .hero-section h1 {

                min-height:
                    98px;

                font-size:
                    29px;

                line-height:
                    1.12;
            }


            .hero-section p {

                font-size:
                    13.5px;

                line-height:
                    1.65;
            }


            .card {

                padding:
                    19px;
            }


            .card h3 {

                font-size:
                    16px;
            }


            .deal-discount {

                top:
                    14px;

                right:
                    14px;
            }


            .deal-title {

                margin-right:
                    70px;
            }
        }


        /* =========================================================
           ACCESSIBILITY
        ========================================================= */

        button:focus-visible,
        input:focus-visible,
        a:focus-visible {

            outline:
                3px solid
                rgba(37, 99, 235, 0.18);

            outline-offset:
                2px;
        }


        @media (prefers-reduced-motion: reduce) {

            .hero-section h1::before {

                animation:
                    none;
            }

            *,
            *::before,
            *::after {

                scroll-behavior:
                    auto !important;

                transition:
                    none !important;
            }
        }

    </style>
</head>


<body>

    <!-- =========================================================
         HEADER
    ========================================================= -->

    <header>

        <div class="logo-container">

            <div class="logo-icon">
                CD
            </div>

            <div class="logo-text">
                CheckerDiscount
            </div>

        </div>


        <div class="trust-badge">

            <span>🛡️</span>

            Verified Deals & Price Savings

        </div>

    </header>


    <!-- =========================================================
         MAIN
    ========================================================= -->

    <div class="main-container">


        <!-- =====================================================
             HERO
        ===================================================== -->

        <div class="hero-section">

            <h1>
                Find Deals Worth Clicking
            </h1>

            <p>
                Discover verified deals, see the real savings,
                and check the retailer's offer before you buy.
            </p>

        </div>


        <!-- =====================================================
             TWO COLUMN CONTENT
        ===================================================== -->

        <div class="grid-layout">


            <!-- =================================================
                 LIVE DEALS
            ================================================= -->

            <div class="card">

                <h3>
                    🔥 Live Verified Market Deals
                </h3>


                <div id="discountsContainer">

                    <p>
                        Finding today's verified deals...
                    </p>

                </div>

            </div>


            <!-- =================================================
                 REFUND ESTIMATOR
            ================================================= -->

            <div class="card">

                <h3>
                    💡 Price Drop Refund Estimator
                </h3>


                <form id="refundForm">


                    <div class="form-group">

                        <label>
                            Retailer / Store Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="e.g. Amazon, Walmart"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Purchase Price ($)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            placeholder="149.99"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Current Price ($)
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            class="form-control"
                            placeholder="119.99"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Calculate Potential Savings
                    </button>


                </form>

            </div>


        </div>

    </div>


    <!-- =========================================================
