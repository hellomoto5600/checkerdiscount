<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checker Discount - Live Deals & Refund Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Top Bar -->
    <header class="navbar">
        <div class="logo">Checker Discount</div>
        <div class="status-badge">⚡ Ad-Free & High-Trust</div>
    </header>

    <!-- Hero Section -->
    <main class="container">
        <section class="hero">
            <h1>Track Real Discounts & Claim Refunds</h1>
            <p>Monitored directly via Cloudflare D1 Database</p>
        </section>

        <!-- Live Products Grid -->
        <section class="products-section">
            <h2>Latest Verified Discounts</h2>
            <div id="product-grid" class="grid">
                <p class="loading">Loading deals from database...</p>
            </div>
        </section>

        <!-- Claim Refund Form -->
        <section class="refund-section">
            <h2>Track Price Drop Refund</h2>
            <form id="refundForm" class="form-card">
                <input type="text" id="storeName" placeholder="Store Name (e.g. Amazon)" required>
                <input type="number" step="0.01" id="purchasePrice" placeholder="Purchase Price ($)" required>
                <input type="number" step="0.01" id="currentPrice" placeholder="Current Price ($)" required>
                <button type="submit" class="btn">Calculate & Track Refund</button>
            </form>
            <div id="refundResult" class="result-message"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
