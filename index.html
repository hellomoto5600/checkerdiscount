<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckerDiscount - Verified Deals & Price Drops</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Country Filter Bar */
        .country-filter-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .country-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .country-btn:hover, .country-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Section Headings */
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
        }

        /* Deals Grid */
        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .deal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .deal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .deal-image-wrap {
            position: relative;
            height: 180px;
            background: #f1f5f9;
        }

        .deal-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .deal-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
        }

        .deal-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .deal-rating {
            font-size: 14px;
            color: #f59e0b;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .deal-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .deal-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .price-section {
            display: flex;
            gap: 10px;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .old-price {
            text-decoration: line-through;
            color: var(--text-muted);
            font-size: 13px;
        }

        .new-price {
            font-size: 18px;
            font-weight: bold;
            color: #16a34a;
        }

        .savings-text {
            font-size: 12px;
            color: #dc2626;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .deal-btn {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin-top: auto;
            transition: background 0.2s;
        }

        .deal-btn:hover {
            background: var(--primary-dark);
        }

        .no-deals {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            background: #fff;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">🛡️ CheckerDiscount</a>
    </header>

    <div class="container">
        <!-- Country Filter Selection -->
        <div class="country-filter-bar">
            <button class="country-btn active" onclick="selectCountry('ALL', this)">🌍 All Countries</button>
            <button class="country-btn" onclick="selectCountry('OM', this)">🇴🇲 Oman</button>
            <button class="country-btn" onclick="selectCountry('US', this)">🇺🇸 United States</button>
            <button class="country-btn" onclick="selectCountry('GB', this)">🇬🇧 United Kingdom</button>
            <button class="country-btn" onclick="selectCountry('SA', this)">🇸🇦 Saudi Arabia</button>
        </div>

        <!-- Spotlight / Featured Deals Section -->
        <h2>⭐ Spotlight Deals</h2>
        <div id="featured-container" class="deals-grid">
            <!-- Rendered dynamically via app.js -->
        </div>

        <!-- Main Deals Section -->
        <h2>🔥 Verified Deals</h2>
        <div id="deals-container" class="deals-grid">
            <!-- Rendered dynamically via app.js -->
        </div>
    </div>

    <!-- Link to Frontend Logic -->
    <script src="app.js"></script>
    <script>
        // Helper function for country button active state styling
        function selectCountry(code, btnElement) {
            document.querySelectorAll('.country-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            if (typeof filterByCountry === 'function') {
                filterByCountry(code);
            }
        }
    </script>
</body>
</html>
